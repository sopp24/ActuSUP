name: Surveiller l’actualisation ActuSUP

on:
  workflow_run:
    workflows:
      - "Actualiser ActuSUP"
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actusup-news-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Vérifier et relancer la collecte si nécessaire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Contrôler la dernière collecte et réparer automatiquement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # Relancer automatiquement un échec du collecteur, avec deux nouvelles tentatives maximum.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            if [ "${WORKFLOW_RUN_CONCLUSION}" = "success" ]; then
              echo "Collecte réussie : aucune réparation nécessaire."
              exit 0
            fi

            if [ "${WORKFLOW_RUN_CONCLUSION}" != "failure" ] \
              && [ "${WORKFLOW_RUN_CONCLUSION}" != "timed_out" ] \
              && [ "${WORKFLOW_RUN_CONCLUSION}" != "cancelled" ]; then
              echo "Conclusion ${WORKFLOW_RUN_CONCLUSION} : aucune relance."
              exit 0
            fi

            ATTEMPT="${WORKFLOW_RUN_ATTEMPT:-1}"
            if [ "${ATTEMPT}" -lt 3 ]; then
              echo "Relance de la tentative ${ATTEMPT} du run ${WORKFLOW_RUN_ID} après ${WORKFLOW_RUN_CONCLUSION}."
              curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${API}/actions/runs/${WORKFLOW_RUN_ID}/rerun"
              echo "Nouvelle tentative demandée."
              exit 0
            fi

            # Après trois échecs du même run, ouvrir un nouveau cycle indépendant
            # plutôt que de laisser la chaîne automatique s'arrêter définitivement.
            echo "Trois tentatives épuisées. Nouveau cycle dans cinq minutes."
            sleep 300
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"ref":"main"}' \
              "${API}/actions/workflows/update-news.yml/dispatches"
            echo "Nouveau cycle demandé."
            exit 0
          fi

          RUNS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/actions/workflows/update-news.yml/runs?branch=main&per_page=30")"

          LAST_SUCCESS="$(printf '%s' "${RUNS}" | jq -r \
            '[.workflow_runs[] | select(.conclusion == "success")][0].updated_at // empty')"

          NOW="$(date -u +%s)"
          if [ -n "${LAST_SUCCESS}" ]; then
            SUCCESS_TS="$(date -u -d "${LAST_SUCCESS}" +%s)"
            AGE="$((NOW - SUCCESS_TS))"
            if [ "${AGE}" -lt 900 ]; then
              echo "Collecte récente réussie il y a ${AGE} secondes : aucune relance nécessaire."
              exit 0
            fi
          else
            AGE=999999
          fi

          # Une exécution active depuis plus de neuf minutes est considérée comme bloquée.
          ACTIVE="$(printf '%s' "${RUNS}" | jq -c \
            '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")][0] // empty')"

          if [ -n "${ACTIVE}" ]; then
            ACTIVE_ID="$(printf '%s' "${ACTIVE}" | jq -r '.id')"
            ACTIVE_TIME="$(printf '%s' "${ACTIVE}" | jq -r '.run_started_at // .created_at')"
            ACTIVE_TS="$(date -u -d "${ACTIVE_TIME}" +%s)"
            ACTIVE_AGE="$((NOW - ACTIVE_TS))"
            if [ "${ACTIVE_AGE}" -lt 540 ]; then
              echo "Le workflow principal est actif depuis ${ACTIVE_AGE} secondes : on le laisse terminer."
              exit 0
            fi
            echo "L’exécution ${ACTIVE_ID} semble bloquée depuis ${ACTIVE_AGE} secondes : annulation puis relance."
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/actions/runs/${ACTIVE_ID}/cancel"
          fi

          echo "Aucune collecte réussie récente (âge : ${AGE} secondes). Relance du workflow principal."
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "${API}/actions/workflows/update-news.yml/dispatches"
          echo "Relance demandée avec succès."
