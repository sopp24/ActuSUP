name: Surveiller l’actualisation ActuSUP

on:
  # Tester automatiquement le watchdog lorsque l’un des workflows change.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-news.yml"
      - ".github/workflows/watchdog-news.yml"

  # Vérification de secours indépendante de la fin du collecteur.
  schedule:
    - cron: "7,27,47 * * * *"

  # Réagir à la fin d’une collecte et relancer uniquement les échecs.
  workflow_run:
    workflows:
      - "Actualiser ActuSUP"
    types:
      - completed

  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actusup-news-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Vérifier et relancer la collecte si nécessaire
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contrôler la dernière collecte et réparer automatiquement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # Une collecte réussie ne nécessite aucune réparation.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            if [ "${WORKFLOW_RUN_CONCLUSION}" = "success" ]; then
              echo "Collecte réussie : aucune réparation nécessaire."
              exit 0
            fi

            # Ne pas recréer une relance lorsqu'une exécution a été annulée
            # volontairement par le watchdog pendant sa détection d'un blocage.
            if [ "${WORKFLOW_RUN_CONCLUSION}" != "failure" ] \
              && [ "${WORKFLOW_RUN_CONCLUSION}" != "timed_out" ]; then
              echo "Conclusion ${WORKFLOW_RUN_CONCLUSION} : aucune relance automatique."
              exit 0
            fi

            ATTEMPT="${WORKFLOW_RUN_ATTEMPT:-1}"
            if [ "${ATTEMPT}" -lt 3 ]; then
              echo "Relance de la tentative ${ATTEMPT} du run ${WORKFLOW_RUN_ID}."
              curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${API}/actions/runs/${WORKFLOW_RUN_ID}/rerun"
              echo "Nouvelle tentative demandée."
              exit 0
            fi

            echo "Trois tentatives épuisées : lancement d’un nouveau cycle."
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d '{"ref":"main"}' \
              "${API}/actions/workflows/update-news.yml/dispatches"
            echo "Nouveau cycle demandé."
            exit 0
          fi

          # Petit délai pour laisser le collecteur démarrer après le cron.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            sleep 20
          fi

          RUNS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/actions/workflows/update-news.yml/runs?branch=main&per_page=30")"

          LAST_SUCCESS="$(printf '%s' "${RUNS}" | jq -r \
            '[.workflow_runs[] | select(.conclusion == "success")][0].updated_at // empty')"

          NOW="$(date -u +%s)"
          if [ -n "${LAST_SUCCESS}" ]; then
            SUCCESS_TS="$(date -u -d "${LAST_SUCCESS}" +%s)"
            SUCCESS_AGE="$((NOW - SUCCESS_TS))"
            if [ "${SUCCESS_AGE}" -lt 1200 ]; then
              echo "Dernière collecte réussie il y a ${SUCCESS_AGE} secondes : rien à réparer."
              exit 0
            fi
          else
            SUCCESS_AGE=999999
          fi

          # Le collecteur a un timeout de quinze minutes : au-delà de quatorze
          # minutes, une exécution encore active est considérée comme bloquée.
          ACTIVE="$(printf '%s' "${RUNS}" | jq -c \
            '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")][0] // empty')"

          if [ -n "${ACTIVE}" ]; then
            ACTIVE_ID="$(printf '%s' "${ACTIVE}" | jq -r '.id')"
            ACTIVE_TIME="$(printf '%s' "${ACTIVE}" | jq -r '.run_started_at // .created_at')"
            ACTIVE_TS="$(date -u -d "${ACTIVE_TIME}" +%s)"
            ACTIVE_AGE="$((NOW - ACTIVE_TS))"

            if [ "${ACTIVE_AGE}" -lt 840 ]; then
              echo "Collecte active depuis ${ACTIVE_AGE} secondes : on la laisse terminer."
              exit 0
            fi

            echo "Collecte ${ACTIVE_ID} bloquée depuis ${ACTIVE_AGE} secondes : annulation."
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/actions/runs/${ACTIVE_ID}/cancel"
            sleep 5
          fi

          echo "Aucune collecte réussie depuis ${SUCCESS_AGE} secondes : relance du collecteur."
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "${API}/actions/workflows/update-news.yml/dispatches"
          echo "Relance demandée avec succès."
