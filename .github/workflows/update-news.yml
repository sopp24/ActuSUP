name: Actualiser ActuSUP

on:
  push:
    branches:
      - main
    paths:
      - "fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Ne pas interrompre une collecte valide lorsqu’un nouveau déclencheur arrive.
# La durée maximale et le watchdog gèrent les exécutions anormalement longues.
concurrency:
  group: actusup-news-update
  cancel-in-progress: false

jobs:
  update:
    name: Collecter les flux des médias
    runs-on: ubuntu-latest
    # Le job collecte, puis attend la fin du cycle de dix minutes avant de se relancer.
    timeout-minutes: 15
    steps:
      # Aucun `uses:` ici : le dépôt est soumis à une politique qui bloque
      # les actions hébergées dans d’autres dépôts, y compris actions/checkout.
      - name: Récupérer le dépôt et actualiser les actualités
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          START_EPOCH="$(date +%s)"

          # Authentifier Git via le jeton intégré du workflow sans l'inscrire dans l'URL du dépôt.
          TOKEN_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${TOKEN_B64}"

          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo

          # Utiliser Python déjà installé sur l'agent GitHub, sans action externe setup-python.
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check -r requirements.txt

          python -m py_compile fetch_news.py
          python - <<'PY'
          from fetch_news import categorize, communication_angle_for

          checks = [
              ("Les emplois progressent dans plusieurs secteurs", "Économie"),
              ("Le réseau de transport public évolue", "Société"),
              ("Le vote de la loi est attendu au Parlement", "Politique"),
              ("Plusieurs journalistes couvrent les manifestations", "Médias & communication"),
              ("Des inondations touchent plusieurs territoires", "Environnement"),
              ("Les scientifiques publient leurs résultats", "Sciences & tech"),
          ]
          for sample, expected in checks:
              actual = categorize(sample)
              if actual != expected:
                  raise SystemExit(f"Catégorisation incorrecte : {sample!r} → {actual!r} (attendu : {expected!r})")

          employment_angle = communication_angle_for(
              "Les emplois progressent dans plusieurs secteurs", "", "Économie"
          )
          if "juridique" in employment_angle.lower():
              raise SystemExit("Faux positif dans l’angle communication : le mot « loi » a été détecté dans « emplois ».")
          PY

          python fetch_news.py
          python -m json.tool data/news.json > /dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Aucune modification des actualités à enregistrer."
          else
            git commit -m "chore: actualiser la veille ActuSUP"
            # Un autre commit peut arriver pendant la collecte (modification de workflow,
            # déploiement ou autre automatisation). Rebaser avant de pousser pour éviter
            # le rejet non-fast-forward et perdre une collecte réussie.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          # Nettoyer le paramètre d'authentification Git avant la suite.
          git config --global --unset-all http.https://github.com/.extraheader || true

          # Auto-chaînage : la prochaine collecte est programmée dix minutes
          # après le début de celle-ci. Cela ne dépend plus de l'événement cron.
          ELAPSED="$(( $(date +%s) - START_EPOCH ))"
          WAIT_SECONDS="$(( 600 - ELAPSED ))"
          if [ "$WAIT_SECONDS" -gt 0 ]; then
            echo "Prochaine collecte dans ${WAIT_SECONDS} secondes."
            sleep "$WAIT_SECONDS"
          else
            echo "La collecte a dépassé dix minutes : relance immédiate."
          fi

          echo "Programmation de la prochaine collecte via workflow_dispatch."
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update-news.yml/dispatches"
          echo "Prochaine collecte mise en file d'attente avec succès."
